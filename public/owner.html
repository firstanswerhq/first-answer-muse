<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Answer · Owner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span> First Answer <span class="on">on Meta Muse</span></div>
  <nav><a href="/">Customer</a><a href="/owner.html" class="active">Owner view</a></nav>
</header>
<section class="board">
  <h1 id="title">Your front desk</h1>
  <div class="sub" id="sub">Every text, photo, voicemail and call, answered and logged as it happens.</div>
  <nav class="bizpick" id="bizpick" aria-label="Demo businesses"></nav>
  <div class="kpis">
    <div class="kpi"><b id="kLeads">0</b><span>new leads</span></div>
    <div class="kpi"><b id="kBooked">0</b><span>jobs booked</span></div>
    <div class="kpi"><b id="kValue">$0</b><span>booked work</span></div>
    <div class="kpi"><b id="kMissed">0</b><span>leads left waiting</span></div>
  </div>
  <p class="keynote" id="keynote" role="status" hidden></p>
  <div class="feed" id="feed"></div>
</section>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const leads = new Map();
const bookings = new Map();
const time = (iso) => new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });

// ?b=<id> shows one demo business's board (Sight sends each job to the business that does it);
// without it, every demo business's leads, each tagged with its business. Front-desk leads (text,
// photo, voicemail, call) belong to Brightside Exterior Care.
const BIZ = new URLSearchParams(location.search).get('b');
const FRONT_DESK = 'brightside';
const bizOf = (l) => l.business?.id || FRONT_DESK;
// A Sight lead: the customer's photo with SAM 3.1's masks drawn on it (owner key only), Muse Spark's
// verdict on those masks, and the measured job.
const COLOR_ROLE = { MAGENTA: 'measured', ORANGE: 'ruler', BLUE: 'other side' };
function sightBlock(l) {
  const s = l.sight;
  const sp = s.spark;
  const verdict = s.checked === 'agreed'
    ? `<p class="chk ok">Muse Spark checked SAM’s masks${sp?.corrected ? ' (after correcting SAM once)' : ''} and agreed${sp?.seen ? `: ${sp.seen.map((o) => `${COLOR_ROLE[o.color] || o.color.toLowerCase()} = ${esc(o.seen)}`).join(', ')}` : ''}</p>`
    : '<p class="chk warn">Unchecked: Muse Spark’s check of SAM’s masks didn’t come back, so measure on site before quoting</p>';
  const photo = l.photo
    ? `<figure class="sight-photo"><img src="${esc(l.photo)}" alt="The customer’s photo with SAM 3.1’s masks drawn on it"><figcaption>SAM 3.1’s masks: magenta = what was measured, orange = the ruler${s.task === 'gap_fit' ? ', blue = the other side' : ''}</figcaption></figure>`
    : s.hasPhoto ? '<p class="dim">Photo with SAM’s masks: owner key only</p>' : '';
  return `<div class="sight">${photo}<div class="sight-body">${s.headline ? `<p class="sight-head">${esc(s.headline)}</p>` : ''}<p><b>Measured from one photo:</b> ${esc(s.job)}</p>${(s.materials || []).length ? `<p>Materials: ${s.materials.map(esc).join(' · ')}</p>` : ''}<p>Quote line: ${esc(s.quote)}</p>${verdict}${s.measuredAgainst ? `<p class="dim">Measured against ${esc(s.measuredAgainst)}${s.confidence ? ` · ${esc(s.confidence)} confidence` : ''}</p>` : ''}</div></div>`;
}

function render() {
  const all = [...leads.values()].filter((l) => !BIZ || bizOf(l) === BIZ).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  $('feed').innerHTML = all.length ? all.map((l) => {
    const b = l.bookingId ? bookings.get(l.bookingId) : null;
    return `<div class="card"><div class="row"><span class="chan ${l.channel}">${esc(l.channel)}</span>${!BIZ && l.business ? `<span class="biztag">${esc(l.business.name)}</span>` : ''}<b>${esc(l.name || l.phone || 'New customer')}</b>
      <span class="status ${l.status === 'booked' ? 'booked' : ''}">${esc(l.status)}</span><span class="when">${time(l.createdAt)}</span></div>
      ${l.summary ? `<p>${esc(l.summary)}</p>` : ''}
      ${l.transcript ? `<p><i>Voicemail:</i> "${esc(l.transcript)}"</p>` : ''}
      ${l.quote ? `<p>Quoted: ${esc(l.quote.serviceName)}, ${esc(l.quote.detail)}, <b>$${l.quote.total}</b></p>` : ''}
      ${l.notes ? `<p>Crew note: ${esc(l.notes)}</p>` : ''}
      ${l.sight ? sightBlock(l) : ''}
      ${b ? `<p>Booked <b>${esc(b.when)}</b> · ${esc(b.customer)} · ${esc(b.address)} · <b>$${b.quoteTotal}</b></p>` : ''}
    </div>`;
  }).join('') : '<div class="card"><p>No leads yet. Open the customer view and send a text.</p></div>';
  $('kLeads').textContent = all.length;
  $('kBooked').textContent = bookings.size;
  $('kValue').textContent = `$${[...bookings.values()].reduce((n, b) => n + b.quoteTotal, 0)}`;
  $('kMissed').textContent = all.filter((l) => l.status === 'new' || l.status === 'needs owner').length;
}

// Full details only with the owner key, opened as /owner.html#key=... (the part after # never leaves
// the browser). The key is kept for this tab only, wiped from the address bar, and sent as a header.
// Without it the server sends a redacted demo view.
let key = null;
try {
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('key');
  if (fromHash) { sessionStorage.setItem('ownerKey', fromHash); history.replaceState(null, '', location.pathname + location.search); }
  key = sessionStorage.getItem('ownerKey');
} catch {
  key = new URLSearchParams(location.hash.slice(1)).get('key');
}
const headers = key ? { 'x-owner-key': key } : {};
async function refresh() {
  const s = await (await fetch('/api/owner/feed', { headers })).json();
  // A key that the server didn't accept: say so instead of quietly showing the public board.
  const note = $('keynote');
  note.hidden = !(key && s.redacted);
  if (key && s.redacted) note.textContent = 'That owner key didn’t work, so this is the public view: no phone numbers, names or message text. Check the link and open it again.';
  leads.clear();
  bookings.clear();
  s.leads.forEach((l) => leads.set(l.id, l));
  s.bookings.forEach((b) => bookings.set(b.id, b));
  render();
}
const es = new EventSource('/api/events');
['hello', 'lead', 'booking', 'photo', 'voicemail', 'message', 'measure'].forEach((k) => es.addEventListener(k, refresh));
fetch(`/api/business${BIZ ? `?b=${encodeURIComponent(BIZ)}` : ''}`).then((r) => r.json()).then((b) => {
  $('title').textContent = BIZ ? `${b.name}: owner board` : 'Owner boards: every demo business';
  if (BIZ && BIZ !== FRONT_DESK) $('sub').textContent = `Jobs measured from one photo with First Answer Sight, sent by the customer. ${b.name} is a demo business with demo prices.`;
  if (!BIZ) $('sub').textContent = 'Every lead, tagged with the demo business it went to. Brightside Exterior Care’s front desk also answers texts, photos, voicemails and calls.';
  $('bizpick').innerHTML = [`<a href="/owner.html"${!BIZ ? ' class="on"' : ''}>All</a>`, ...b.all.map((x) => `<a href="/owner.html?b=${encodeURIComponent(x.id)}"${x.id === BIZ ? ' class="on"' : ''}>${esc(x.name)}</a>`)].join('');
}).catch(() => {});
refresh();
</script>
</body>
</html>
